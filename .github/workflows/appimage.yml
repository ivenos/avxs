name: AppImage

# Also on changes to this file: the pinned tool versions live here, and a bump that
# breaks the build would otherwise surface at the next release and nowhere else.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the artifact names, e.g. v1.0.0. Empty uses dev-<sha>."
        required: false
  pull_request:
    paths: [".github/workflows/appimage.yml"]
  push:
    branches: [main]
    paths: [".github/workflows/appimage.yml"]

env:
  SVT_AV1_VERSION: v4.2.0
  # Rolling-release repo: pin a main commit, bump via PR.
  SVT_AV1_HDR_REF: cfb4e17693ae16945a7fe288d45437243d96c12e
  FFMS2_VERSION: "5.0"
  FFMPEG_VERSION: n9.0.1
  VSHIP_VERSION: v5.1.0
  RUST_VERSION: 1.97.1
  LINUXDEPLOY_VERSION: 1-alpha-20251107-1

# The appimage job opts into contents: write to attach release assets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release can be cut from any commit, including one whose tests never ran.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffms2-dev nasm

      - name: Run unit tests
        run: cargo test --locked

  appimage:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            enable_avx512: "ON"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            enable_avx512: "OFF"
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        # Not interpolated: both are attacker-chosen text and this writes $GITHUB_ENV.
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="$RELEASE_TAG"
          else
            VERSION="${INPUT_VERSION:-dev-${GITHUB_SHA:0:7}}"
          fi
          case "$VERSION" in
            *[!A-Za-z0-9._-]*|"") echo "::error::refusing unusual version name"; exit 1 ;;
          esac
          echo "AVXS_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake nasm yasm git curl ca-certificates \
            pkg-config autoconf automake libtool \
            zlib1g-dev libbz2-dev liblzma-dev \
            libopus-dev libmp3lame-dev libvorbis-dev libdav1d-dev \
            libvulkan-dev \
            mkvtoolnix \
            file desktop-file-utils zsync \
            fuse libfuse2

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: appimage-${{ matrix.arch }}

      - name: Build SVT-AV1
        run: |
          git clone --depth 1 --branch "$SVT_AV1_VERSION" \
            https://gitlab.com/AOMediaCodec/SVT-AV1.git /tmp/svt-av1
          cmake -B /tmp/svt-av1/build /tmp/svt-av1 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_AVX512=${{ matrix.enable_avx512 }} -DNATIVE=OFF
          cmake --build /tmp/svt-av1/build --parallel "$(nproc)"
          sudo cmake --install /tmp/svt-av1/build

      - name: Build SVT-AV1-hdr
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/juliobbv-p/svt-av1-hdr.git /tmp/svt-av1-hdr
          git -C /tmp/svt-av1-hdr checkout "$SVT_AV1_HDR_REF"
          cmake -B /tmp/svt-av1-hdr/build /tmp/svt-av1-hdr \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local/hdr \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_AVX512=${{ matrix.enable_avx512 }} -DNATIVE=OFF
          cmake --build /tmp/svt-av1-hdr/build --parallel "$(nproc)"
          sudo cmake --install /tmp/svt-av1-hdr/build
          sudo cp /usr/local/hdr/bin/SvtAv1EncApp /usr/local/bin/SvtAv1EncApp-hdr

      - name: Build FFmpeg
        # Ubuntu 24.04 ships 6.1, too old for Vship (AVCOL_SPC_YCGCO_RE), and the Docker
        # image gets 8.1 from Alpine. Both artefacts run the same ffmpeg this way.
        run: |
          git clone --depth 1 --branch "$FFMPEG_VERSION" \
            https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg
          cd /tmp/ffmpeg
          ./configure \
            --prefix=/usr/local \
            --enable-shared --disable-static \
            --disable-doc --disable-ffplay \
            --enable-gpl \
            --enable-libopus --enable-libmp3lame --enable-libvorbis --enable-libdav1d
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Build FFMS2
        run: |
          git clone --depth 1 --branch "$FFMS2_VERSION" \
            https://github.com/FFMS/ffms2.git /tmp/ffms2
          cd /tmp/ffms2
          mkdir -p src/config
          autoreconf -fiv
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig \
            ./configure --prefix=/usr/local --enable-shared=yes --enable-static=no
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Build Vship (FFVship, Vulkan backend)
        run: |
          git clone --depth 1 --branch "$VSHIP_VERSION" \
            https://codeberg.org/Line-fr/Vship.git /tmp/vship
          cd /tmp/vship
          make buildVulkan
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig make buildFFVSHIP
          sudo install -m755 FFVship /usr/local/bin/FFVship
          sudo install -m755 libvship.so /usr/local/lib/libvship.so
          sudo ldconfig

      - name: Build avxs
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
        run: cargo build --release --locked

      - name: Stage AppDir
        run: |
          set -eux
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib"

          cp target/release/avxs              "$APPDIR/usr/bin/"
          cp /usr/local/bin/SvtAv1EncApp      "$APPDIR/usr/bin/"
          cp /usr/local/bin/SvtAv1EncApp-hdr  "$APPDIR/usr/bin/"
          cp /usr/local/bin/ffmsindex         "$APPDIR/usr/bin/"
          cp /usr/local/bin/ffmpeg            "$APPDIR/usr/bin/"
          cp /usr/local/bin/ffprobe           "$APPDIR/usr/bin/"
          cp "$(command -v mkvmerge)"         "$APPDIR/usr/bin/"
          cp /usr/local/bin/FFVship           "$APPDIR/usr/bin/"

          cp /usr/local/lib/libffms2.so*      "$APPDIR/usr/lib/"
          cp /usr/local/lib/libvship.so       "$APPDIR/usr/lib/"

      - name: Build AppImage
        # A release tag, not "continuous": the same avxs tag has to keep producing the
        # same artefact.
        run: |
          set -eux
          curl -fsSLO "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-${{ matrix.arch }}.AppImage"
          chmod +x "linuxdeploy-${{ matrix.arch }}.AppImage"

          OUTPUT="avxs-${AVXS_VERSION}-${{ matrix.arch }}.AppImage" \
          "./linuxdeploy-${{ matrix.arch }}.AppImage" \
            --appdir AppDir \
            --desktop-file packaging/appimage/avxs.desktop \
            --icon-file packaging/appimage/avxs.svg \
            --output appimage

      - name: Smoke test
        run: |
          set +e
          mkdir -p /tmp/smoke && cd /tmp/smoke
          timeout 10 "$GITHUB_WORKSPACE/avxs-${AVXS_VERSION}-${{ matrix.arch }}.AppImage" 2>&1 | tee smoke.log
          set -e
          grep -q "avxs started" smoke.log

      # avxs logs "avxs started" before touching a tool, so the smoke test above passes
      # on an AppImage with nothing bundled.
      - name: Every bundled tool starts
        run: |
          set -eux
          cd /tmp
          "$GITHUB_WORKSPACE/avxs-${AVXS_VERSION}-${{ matrix.arch }}.AppImage" --appimage-extract >/dev/null
          BIN="/tmp/squashfs-root/usr/bin"

          "$BIN/ffmpeg"           -hide_banner -version >/dev/null
          "$BIN/ffprobe"          -hide_banner -version >/dev/null
          "$BIN/mkvmerge"         --version             >/dev/null
          "$BIN/SvtAv1EncApp"     --version             >/dev/null
          "$BIN/SvtAv1EncApp-hdr" --version             >/dev/null
          # ffmsindex exits non-zero without arguments; the usage text proves it loaded.
          "$BIN/ffmsindex" 2>&1 | grep -qi usage
          # No GPU here, so "no device" is success and only a loader error is a failure.
          # `grep -v` cannot tell them apart: one clean line and it passes.
          "$BIN/FFVship" --list-gpu >ffvship.log 2>&1 || true
          if grep -qiE "error relocating|symbol not found|cannot open shared object" ffvship.log; then
            echo "::error::FFVship did not load"
            cat ffvship.log
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: avxs-${{ env.AVXS_VERSION }}-${{ matrix.arch }}.AppImage
          path: avxs-${{ env.AVXS_VERSION }}-${{ matrix.arch }}.AppImage
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: avxs-${{ env.AVXS_VERSION }}-${{ matrix.arch }}.AppImage
          fail_on_unmatched_files: true
