name: Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GITHUB_IMAGE: ghcr.io/ivenos/avxs
  DOCKERHUB_IMAGE: ivenos/avxs
  # Kept in lockstep with the Dockerfile and appimage.yml by Renovate.
  RUST_VERSION: "1.97.1"

# Jobs that publish opt into more below.
permissions:
  contents: read

# Two pushes to main would otherwise race to move the same :dev tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The version the image builds with, not `stable`: a newly stabilised API would
      # pass here and fail 25 minutes later inside the image build.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffms2-dev nasm

      - name: Run unit tests
        run: cargo test --locked

  integration:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Not test/run.sh's own build: without the layer cache, SVT-AV1, FFMS2 and Vship
      # eat the timeout before the first test runs.
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: avxs:test
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Run integration tests
        run: ./test/run.sh --no-build

  # The arm64 side of what the integration job proves for amd64. On pushes too: changes
  # land as direct pushes to main, and a PR-only job would miss them.
  build-arm64:
    name: Build arm64 (no push)
    needs: [test, integration]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: avxs:arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      # Compiling proves nothing about a binary that aborts under aarch64 musl, or a
      # library missing from the runtime stage.
      - name: Every bundled tool starts
        run: |
          docker run --rm --entrypoint sh avxs:arm64 -c '
            set -e
            ffmpeg   -hide_banner -version >/dev/null
            ffprobe  -hide_banner -version >/dev/null
            mkvmerge --version             >/dev/null
            SvtAv1EncApp     --version     >/dev/null
            SvtAv1EncApp-hdr --version     >/dev/null
            # ffmsindex exits non-zero without arguments; the usage text proves it loaded.
            # Piping it into head only ever reports on head.
            ffmsindex 2>&1 | grep -qi usage
            FFVship --list-gpu             >/dev/null
            # avxs is a daemon and takes no arguments, so `avxs --version` would run the
            # scan loop until this job times out.
            timeout -s KILL 10 avxs >/tmp/start.log 2>&1 || true
            grep -q "avxs started" /tmp/start.log
          '

  build:
    needs: [test, integration]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GITHUB_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.GITHUB_IMAGE }},docker.io/${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  push:
    runs-on: ubuntu-latest
    needs: build
    # The tag rules below produce nothing off main or a tag, leaving imagetools no -t.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GITHUB_IMAGE }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Stable only: a `v1.2.0-rc1` would otherwise move :latest.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-') }}

      - name: Create and push multi-arch manifest to GHCR
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("ghcr.io"))) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GITHUB_IMAGE }}@sha256:%s ' *)

      - name: Prepare Docker Hub README
        run: |
          printf '**Note:** This description is automatically generated from the [GitHub repository README](https://github.com/ivenos/avxs).\n\n---\n\n' \
            | cat - README.md > /tmp/dockerhub-readme.md

      - name: Create and push multi-arch manifest to Docker Hub
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("ghcr.io") | not)) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'docker.io/${{ env.DOCKERHUB_IMAGE }}@sha256:%s ' *)

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: /tmp/dockerhub-readme.md
